name: FastAPI & Docker CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Grants permission to push packages to GitHub Container Registry
permissions:
  contents: read
  packages: write

jobs:
  validate-code:
    name: Code Validation & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f webapp/vps/requirements.txt ]; then pip install -r webapp/vps/requirements.txt; fi
          pip install ruff pytest

      - name: Lint code with Ruff
        run: |
          ruff check webapp/vps/ --fix

  build-and-push-ghcr:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    needs: validate-code
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./webapp/vps
          file: ./webapp/vps/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/kamue-digital-lora-sensor:latest
