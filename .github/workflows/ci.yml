name: FastAPI & Docker CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate-code:
    name: Code Validation & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f webapp/vps/requirements.txt ]; then pip install -r webapp/vps/requirements.txt; fi
          pip install ruff pytest

      - name: Lint code with Ruff
        run: |
          ruff check webapp/vps/ --fix

  build-docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: validate-code

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker Build
        uses: docker/build-push-action@v6
        with:
          context: ./webapp/vps
          file: ./webapp/vps/Dockerfile
          push: false

  deploy-to-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [validate-code, build-docker]
    # Only deploy when pushing directly to main branch (not pull requests)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app
            # Force Docker Compose to build without build cache and recreate the container
            docker compose build --no-cache backend-api
            docker compose up -d --force-recreate backend-api

            # Prune old unused docker images to prevent disk space issues
            docker image prune -f
