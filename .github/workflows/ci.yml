name: FastAPI & Docker CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Grants permission to push packages to GitHub Container Registry
permissions:
  contents: read
  packages: write

jobs:
  validate-api-code:
    name: Code Validation & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f www/vps/api/requirements.txt ]; then pip install -r www/vps/api/requirements.txt; fi
          pip install ruff pytest

      - name: Lint code with Ruff
        run: |
          ruff check www/vps/api/ --fix

      - name: Test API security and archive catalogue
        run: PYTHONPATH=www/vps/api/v1 python -m unittest discover -s www/vps/api/v1/tests

  validate-shake-collector-code:
    name: Code Validation & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f www/vps/shake-collector/requirements.txt ]; then pip install -r www/vps/shake-collector/requirements.txt; fi
          pip install ruff pytest

      - name: Lint code with Ruff
        run: |
          ruff check www/vps/shake-collector/

      - name: Test collector
        run: PYTHONPATH=www/vps/shake-collector:www/vps/tests python -m pytest -q www/vps/shake-collector/tests

  validate-smartcity-collector:
    name: Smart City collector tests
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r www/vps/smartcity-collector/requirements.txt ruff
      - run: ruff check --config www/vps/pyproject.toml www/vps/smartcity-collector
      - run: PYTHONPATH=www/vps/smartcity-collector python -m unittest discover -s www/vps/smartcity-collector/tests
        env:
          SMARTCITY_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
          SMARTCITY_TEST_TIMESCALE: "1"
      - run: pip install -r www/vps/api/requirements.txt
      - run: PYTHONPATH=www/vps/api/v1 python -m unittest discover -s www/vps/api/v1/tests -p test_map_sensors.py
        env:
          MAP_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
          MAP_TEST_TIMESCALE: "1"

  validate-nextbike-collector:
    name: Nextbike collector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r www/vps/nextbike-collector/requirements.txt ruff pytest
      - run: ruff check --config www/vps/pyproject.toml www/vps/nextbike-collector
      - run: PYTHONPATH=www/vps/nextbike-collector:www/vps/tests python -m pytest -q www/vps/nextbike-collector/tests

  validate-traffic-collector:
    name: Traffic collector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r www/vps/traffic-collector/requirements.txt ruff pytest
      - run: ruff check --config www/vps/pyproject.toml www/vps/traffic-collector
      - run: PYTHONPATH=www/vps/traffic-collector:www/vps/tests python -m pytest -q www/vps/traffic-collector/tests

  validate-collector-storage:
    name: Collector database contracts
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r www/vps/api/requirements.txt -r www/vps/shake-collector/requirements.txt -r www/vps/registry-sync-worker/requirements.txt pytest
      - name: Test independent persistence contracts
        run: |
          for service in nextbike traffic shake environment; do
            PYTHONPATH=www/vps/$service-collector:www/vps/tests python -m pytest -q www/vps/$service-collector/tests
          done
          PYTHONPATH=www/vps/registry-sync-worker:www/vps/tests python -m pytest -q www/vps/registry-sync-worker/tests
          PYTHONPATH=www/vps/api/v1:www/vps/tests python -m pytest -q www/vps/api/v1/tests/test_ingestion_batches.py
        env:
          COLLECTOR_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
          COLLECTOR_TEST_TIMESCALE: "1"

  validate-frontend-security:
    name: Frontend security regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: www/open-ried-sens/package-lock.json
      - run: npm ci
        working-directory: www/open-ried-sens
      - run: npm run test:security
        working-directory: www/open-ried-sens
      - run: npm run test:map
        working-directory: www/open-ried-sens

  validate-archive-worker:
    name: Archive export tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: www/vps/archive-worker/package-lock.json
      - run: npm ci
        working-directory: www/vps/archive-worker
      - run: npm test
        working-directory: www/vps/archive-worker
        env:
          ARCHIVE_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres

  build-and-push-ghcr:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    needs:
      - validate-api-code
      - validate-shake-collector-code
      - validate-smartcity-collector
      - validate-nextbike-collector
      - validate-traffic-collector
      - validate-collector-storage
      - validate-archive-worker
      - validate-frontend-security
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image API
        uses: docker/build-push-action@v6
        with:
          context: ./www/vps/api
          file: ./www/vps/api/v1/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/open-ried-sens-api:latest

      - name: Build and Push Docker Image Shake Collector
        uses: docker/build-push-action@v6
        with:
          context: ./www/vps/shake-collector
          file: ./www/vps/shake-collector/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/open-ried-sens-shake-collector:latest

      - name: Build and Push Docker Image Smart City Collector
        uses: docker/build-push-action@v6
        with:
          context: ./www/vps/smartcity-collector
          file: ./www/vps/smartcity-collector/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/open-ried-sens-smartcity-collector:latest

      - name: Build and Push Docker Image Nextbike Collector
        uses: docker/build-push-action@v6
        with:
          context: ./www/vps/nextbike-collector
          file: ./www/vps/nextbike-collector/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/open-ried-sens-nextbike-collector:latest

      - name: Build and Push Docker Image Traffic Collector
        uses: docker/build-push-action@v6
        with:
          context: ./www/vps/traffic-collector
          file: ./www/vps/traffic-collector/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/open-ried-sens-traffic-collector:latest

      - name: Build and Push Docker Image Archive Worker
        uses: docker/build-push-action@v6
        with:
          context: ./www/vps/archive-worker
          file: ./www/vps/archive-worker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/open-ried-sens-archive-worker:latest

      - name: Build and Push Docker Image Environment Collector
        uses: docker/build-push-action@v6
        with:
          context: ./www/vps/environment-collector
          file: ./www/vps/environment-collector/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/open-ried-sens-environment-collector:latest

      - name: Build and Push Docker Image Registry Sync Worker
        uses: docker/build-push-action@v6
        with:
          context: ./www/vps/registry-sync-worker
          file: ./www/vps/registry-sync-worker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/open-ried-sens-registry-sync-worker:latest
