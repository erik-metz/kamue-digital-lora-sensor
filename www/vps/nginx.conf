server {
    listen 80;
    server_name open-ried-sens.duckdns.org;

    # Allow Certbot challenge requests
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name open-ried-sens.duckdns.org;

    # SSL Certificates managed by Certbot
    ssl_certificate /etc/letsencrypt/live/open-ried-sens.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/open-ried-sens.duckdns.org/privkey.pem;

    # Recommended SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://backend_api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

