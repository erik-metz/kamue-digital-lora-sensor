# This file is included in nginx's http context.
limit_req_zone $binary_remote_addr zone=api_requests:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=api_connections:10m;

server {
    listen 80;
    server_name open-ried-sens.duckdns.org;

    # Allow Certbot challenge requests
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name open-ried-sens.duckdns.org;

    # SSL Certificates managed by Certbot
    ssl_certificate /etc/letsencrypt/live/open-ried-sens.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/open-ried-sens.duckdns.org/privkey.pem;

    # Recommended SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Re-resolve the Compose service after API containers are replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    location / {
        set $api_backend backend-api:8080;
        limit_req zone=api_requests burst=20 nodelay;
        limit_req_status 429;
        limit_conn api_connections 10;
        limit_conn_status 429;
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
