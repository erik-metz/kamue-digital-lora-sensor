services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - timescale_data:/var/lib/postgresql/data

  backend-api:
    image: ghcr.io/erik-metz/open-ried-sens-api:latest
    container_name: backend_api
    working_dir: /app/v1
    command: uvicorn main:app --host 0.0.0.0 --port 8080
    restart: always
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      API_KEY: ${API_KEY:?Set a dedicated ingestion key}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set a distinct admin key}
    depends_on:
      - timescaledb

  shake-collector:
    image: ghcr.io/erik-metz/open-ried-sens-shake-collector:latest
    container_name: shake_collector
    restart: always
    environment:
      SHAKE_NETWORK: ${SHAKE_NETWORK:-AM}
      SHAKE_STATIONS: ${SHAKE_STATIONS:-R498E,R82E7,R79F9,RB012,R021A,R5DFB,RC017,R2852,RB8D1,SC342}
      SHAKE_WS_URL: ${SHAKE_WS_URL:-wss://swarm:ujHsN9qbYiTAx69H@data.raspberryshake.org/caps/}
      INGEST_MODE: ${SHAKE_INGEST_MODE:-direct_db}
      API_URL: http://backend-api:8080/api/v1
      API_KEY: ${API_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set a distinct admin key}
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SAMPLING_INTERVAL_SEC: ${SHAKE_SAMPLING_INTERVAL_SEC:-5.0}
      STORE_RAW_WAVEFORM: ${SHAKE_STORE_RAW_WAVEFORM:-false}
    depends_on:
      - backend-api
      - timescaledb

  smartcity-collector:
    image: ghcr.io/erik-metz/open-ried-sens-smartcity-collector:latest
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      SMARTCITY_TENANT: ${SMARTCITY_TENANT:-buerstadt}
      SMARTCITY_DASHBOARD_ID: ${SMARTCITY_DASHBOARD_ID:-76a90123-ba53-4d77-be9f-f11ef90dd63a}
      SMARTCITY_ADDITIONAL_DASHBOARD_IDS: ${SMARTCITY_ADDITIONAL_DASHBOARD_IDS:-24c1807c-3c5a-4809-a57e-33baf13751ea,5a1a6650-26ce-4662-9d52-6e59102e1434,26f92cf2-4b45-4856-b0d3-b606ad186e62}
      SMARTCITY_POLL_SECONDS: ${SMARTCITY_POLL_SECONDS:-60}
      SMARTCITY_ENTITY_IDS: ${SMARTCITY_ENTITY_IDS:-}
      SMARTCITY_METRICS: ${SMARTCITY_METRICS:-}
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - smartcity_state:/data
    depends_on:
      - backend-api
      - timescaledb

  nextbike-collector:
    build:
      context: ./nextbike-collector
      dockerfile: Dockerfile
    image: ghcr.io/erik-metz/open-ried-sens-nextbike-collector:latest
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      NEXTBIKE_BASE_URL: ${NEXTBIKE_BASE_URL:-https://maps.nextbike.net/maps/nextbike-live.json}
      NEXTBIKE_CITY_IDS: ${NEXTBIKE_CITY_IDS:-559}
      NEXTBIKE_POLL_SECONDS: ${NEXTBIKE_POLL_SECONDS:-60}
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - nextbike_state:/data
    depends_on:
      - backend-api
      - timescaledb

  traffic-collector:
    build:
      context: ./traffic-collector
      dockerfile: Dockerfile
    image: ghcr.io/erik-metz/open-ried-sens-traffic-collector:latest
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      TRAFFIC_POLL_SECONDS: ${TRAFFIC_POLL_SECONDS:-180}
      TRAFFIC_ROADS: "A67,A5,A6"
    volumes:
      - traffic_state:/data
    depends_on:
      - backend-api
      - timescaledb


  archive-worker:
    image: ghcr.io/erik-metz/open-ried-sens-archive-worker:latest
    profiles: ["archives"]
    restart: unless-stopped
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      UPLOADTHING_TOKEN: ${UPLOADTHING_TOKEN:-}
      ARCHIVE_PART_MB: ${ARCHIVE_PART_MB:-64}
    depends_on:
      - timescaledb
      - backend-api

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_etc:/etc/letsencrypt
    depends_on:
      - backend-api

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_etc:/etc/letsencrypt

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=false

volumes:
  smartcity_state:
  nextbike_state:
  traffic_state:
  certbot_www:
  certbot_etc:
  timescale_data:
