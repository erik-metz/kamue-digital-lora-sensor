services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  backend-api:
    image: ghcr.io/erik-metz/open-ried-sens-api:latest
    container_name: backend_api
    working_dir: /app/v1
    command: uvicorn main:app --host 0.0.0.0 --port 8080
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      API_KEY: ${API_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-${API_KEY}}
    depends_on:
      - timescaledb

  shake-collector:
    image: ghcr.io/erik-metz/open-ried-sens-shake-collector:latest
    container_name: shake_collector
    restart: always
    environment:
      SHAKE_NETWORK: ${SHAKE_NETWORK:-AM}
      SHAKE_STATION: ${SHAKE_STATION:-R498E}
      SHAKE_LOCATION: ${SHAKE_LOCATION:-00}
      SHAKE_CHANNEL: ${SHAKE_CHANNEL:-EHZ}
      SHAKE_WS_URL: ${SHAKE_WS_URL:-wss://swarm:ujHsN9qbYiTAx69H@data.raspberryshake.org/caps/}
      SENSOR_ID: ${SHAKE_SENSOR_ID:-shake-r498e}
      SENSOR_NAME: "${SHAKE_SENSOR_NAME:-Station 5: Bürstadt Seismometer (Raspberry Shake R498E)}"
      LATITUDE: ${SHAKE_LATITUDE:-49.65766}
      LONGITUDE: ${SHAKE_LONGITUDE:-8.43426}
      INGEST_MODE: ${SHAKE_INGEST_MODE:-api}
      API_URL: http://backend-api:8080/api/v1
      API_KEY: ${API_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-${API_KEY}}
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SAMPLING_INTERVAL_SEC: ${SHAKE_SAMPLING_INTERVAL_SEC:-5.0}
      STORE_RAW_WAVEFORM: ${SHAKE_STORE_RAW_WAVEFORM:-false}
    depends_on:
      - backend-api
      - timescaledb

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_etc:/etc/letsencrypt

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_etc:/etc/letsencrypt

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=false

volumes:
  certbot_www:
  certbot_etc:
  timescale_data:
