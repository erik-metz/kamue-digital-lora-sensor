services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data

  backend-api:
    build: https://github.com/erik-metz/kamue-digital-lora-sensor.git#main:webapp/vps
    container_name: backend_api
    restart: always
    ports:
      - "${API_PORT}:8080"
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      API_KEY: ${API_KEY}
    depends_on:
      - timescaledb

volumes:
  timescale_data:
