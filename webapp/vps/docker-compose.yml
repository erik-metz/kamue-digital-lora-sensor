services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    restart: always
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql # Initializes database automatically on first launch

  backend-api:
    build: https://github.com/erik-metz/kamue-digital-lora-sensor/tree/main/webapp/vps
    container_name: backend_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: mydatabase
      DB_USER: postgres
      DB_PASSWORD: mysecretpassword
    depends_on:
      - timescaledb

volumes:
  timescale_data:
